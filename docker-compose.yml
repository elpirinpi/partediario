services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: parte
      POSTGRES_PASSWORD: parte
      POSTGRES_DB: parte_diario
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parte -d parte_diario"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://parte:parte@db:5432/parte_diario
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-cambia-este-secreto-en-produccion-32chars}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      DATA_DIR: /app/data
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      SECRETS_KEY: ${SECRETS_KEY:-clave-local-de-cifrado-32-chars!!}
    volumes:
      - parte_data:/app/data
    ports:
      - "3001:3001"
    command: sh -c "npm run db:push -w @parte/api && npm run start -w @parte/api"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  parte_data:
